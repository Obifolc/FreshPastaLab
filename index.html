<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fresh Pasta Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-title" content="Pasta Lab"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--g:#172D28;--o:#D7B77A;--iv:#ECE6D6;--w:#FFFFFF;--t:#0E1D19;--s:#434B48;--bd:#B3AA92;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--iv:#0b1311;--w:#24382F;--t:#FFFFFF;--s:#C9D2CE;--bd:#587368}}
:root[data-theme="dark"]{--iv:#0b1311;--w:#24382F;--t:#FFFFFF;--s:#C9D2CE;--bd:#587368}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--iv);color:var(--t);font:18px/1.5 Inter,system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
header{background:var(--g);color:#F3EFE6;padding:26px 20px 22px;font-family:Playfair Display,Playfair Display,Georgia,serif}
header h1{margin:0 0 4px;font-size:32px;letter-spacing:.5px}
.gr{font:700 36px Playfair Display,Georgia,serif;margin:26px 0 6px}.gs{font:18px Inter,system-ui,sans-serif;opacity:.85}.wh{width:40px;height:40px;flex:none;stroke:#D7B77A;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
header small{color:var(--o);font-size:15px;letter-spacing:2px;font-family:Inter,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
main,.c,.tile,.row,.c>*{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word}
input,select,textarea{max-width:100%;min-width:0;box-sizing:border-box}
input[type=date],input[type=time],input[type=month]{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;margin:4px 0 0;box-sizing:border-box;overflow:hidden}
label{display:block;max-width:100%}
.tw{overflow-x:auto;max-width:100%}
html,body{overflow-x:hidden}
.tile>*{min-width:0}
h2{margin:10px 0 14px;font:700 27px Playfair Display,Playfair Display,Georgia,serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--w);border:1px solid var(--bd);border-radius:20px;padding:22px 14px;font:700 19px Playfair Display,Georgia,serif;color:var(--t);text-align:left;min-height:150px;cursor:pointer;overflow-wrap:break-word;hyphens:auto;box-shadow:0 1px 4px rgba(23,45,40,.2)}
.tile span{display:block;font-size:36px;margin-bottom:10px}
.tile i{opacity:1}.tile b{color:#a63a25}.tile svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.tile i{display:block;font:16px Inter,system-ui,sans-serif;color:var(--s);font-style:normal;margin-top:4px}
.c{background:var(--w);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:0 0 14px}
.s{color:var(--s);font:16px/1.4 Inter,system-ui,sans-serif}
.tag{background:var(--o);color:#172D28;border-radius:6px;padding:1px 7px;font:700 14px Inter,system-ui,sans-serif}
button,.b{font:600 15px Inter,system-ui,sans-serif;border:1px solid #FFFFFF;border-radius:12px;padding:9px 16px;min-height:40px;cursor:pointer;background:var(--g);color:#FFFFFF;margin:5px 8px 5px 0}
button.g{background:var(--g);border:1px solid #FFFFFF;color:#FFFFFF}
.row{display:flex;flex-wrap:wrap;margin-top:6px}
label{display:block;font:600 16px Inter,system-ui,sans-serif;color:var(--t);margin:16px 0 0}
input,select,textarea{width:100%;font:18px Inter,system-ui,sans-serif;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--iv);color:var(--t);margin-top:6px}
textarea{min-height:120px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:17px Inter,system-ui,sans-serif}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--bd)}
td input{margin:0;padding:10px;min-width:130px}
.warn{color:#b3402a;font-weight:600}
.ing{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.ing>input{margin:0}
.ir{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ir input.iq{flex:1 1 90px;width:auto;min-width:90px;margin:0}
.ir select{flex:0 0 auto;width:auto;margin:0;padding:14px 10px}
.ia{display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap;font-weight:500}
.ia input{width:auto;margin:0;min-width:0;transform:scale(1.3)}
.ix{margin:0 0 0 auto;padding:10px 16px;min-height:48px}
#pr{display:none}
.lab{border:1px solid #000;padding:3mm;color:#000;background:#fff;font:11px/1.3 Arial,sans-serif}
.lab h3{margin:0 0 2mm;font-size:15px}
@media print{#app{display:none}#pr{display:block;color:#000;background:#fff;font-family:Arial,sans-serif}body{background:#fff}:root{padding:0}}
</style></head>
<body>
<div id="app"></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s);
let S={ric:[],lot:[],abb:[],mag:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('fpl')||'{}'))}catch(x){}
const save=()=>{try{localStorage.setItem('fpl',JSON.stringify(S))}catch(x){alert('Impossibile salvare su questo dispositivo.')}};
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=n=>(+n).toLocaleString('it-IT',{maximumFractionDigits:3});
const td=()=>new Date().toISOString().slice(0,10);
const df=d=>d?d.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const val=i=>$('#'+i).value;
const UN=['kg','g','l','ml','pz','conf'];
const conv=(q,a,b)=>{if(a==b)return q;const m={kg:['m',1000],g:['m',1],l:['v',1000],ml:['v',1],pz:['p',1],conf:['c',1]};return m[a][0]==m[b][0]?q*m[a][1]/m[b][1]:null};
let V='home',P=null;
const go=(v,p)=>{V=v;P=p;render();scrollTo(0,0)};
const bar=(t,x='')=>`<h2>${t}</h2>${x}`;
const F=(l,i,v='',t='text')=>`<label>${l}<input id="${i}" type="${t}" value="${e(v)}"></label>`;
const U=(i,v)=>`<select id="${i}">${UN.map(u=>`<option ${u==v?'selected':''}>${u}</option>`).join('')}</select>`;
const pr=async(h,name,css='')=>{const doc='<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>'+e(name)+'</title><style>body{font-family:Arial,sans-serif;color:#000;background:#fff;margin:12mm}table{border-collapse:collapse}.fr{border:1.5px solid #172D28;border-radius:4mm;padding:6mm;box-sizing:border-box}.lab{border:1.5px solid #000;border-radius:2.5mm;padding:3mm;margin:0;font:11px/1.3 Arial,sans-serif}.lab h3{margin:0 0 2mm;font-size:15px}'+css+'</style></head><body>'+(/size:\d/.test(css)?h:'<div class="fr">'+h+'</div>')+'<script>onload=function(){setTimeout(function(){print()},300)}<\/script></body></html>';
try{const d=await claude.use('downloads');if(!d)return alert('Il salvataggio del file non è disponibile qui.');await d.save({filename:name.replace(/[^\w.-]+/g,'_')+'.html',data:doc})}catch(x){if(!x||x.code!='declined')alert('Salvataggio non riuscito.')}};

const dlg=(msg,conf)=>new Promise(res=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999';d.innerHTML='<div class="c" style="max-width:440px;width:100%;margin:0"><p style="white-space:pre-wrap;margin:0 0 8px">'+e(msg)+'</p><div class="row"><button class="y">'+(conf?'Conferma':'OK')+'</button>'+(conf?'<button class="g n">Annulla</button>':'')+'</div></div>';document.body.appendChild(d);d.querySelector('.y').onclick=()=>{d.remove();res(true)};const n=d.querySelector('.n');if(n)n.onclick=()=>{d.remove();res(false)}});
const ask=m=>dlg(m,true);
window.alert=m=>{dlg(m,false)};
const ic=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const IC_CAL=ic('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>');
const IC_TEM=ic('<path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/>');
const IC={cal:IC_CAL,tem:IC_TEM,ric:ic('<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/>'),lot:ic('<path d="M5 5v14M8.5 5v14M12 5v14M15.5 5v14M19 5v14"/>'),abb:ic('<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 6.5l2.5-2M9.5 19.5l2.5-2 2.5 2"/>'),mag:ic('<path d="M3 10l9-6 9 6v10H3zM7 20v-6h10v6M7 17h10"/>')};
const views={
home:()=>{const in7=new Date(Date.now()+7*864e5).toISOString().slice(0,10),t=td();
const sc=S.mag.filter(m=>m.scad&&m.scad<=in7&&m.q>0).length,lt=S.lot.filter(l=>l.prod==t).length;
const T=(v,i,n,s)=>`<button class="tile t-${v}" onclick="go('${v}')"><span>${i}</span>${n}<i>${s}</i></button>`;
return `<div class="grid">${T('ric',IC.ric,'Ricette',S.ric.length+' salvate')}${T('lot',IC.lot,'Lotti di produzione',lt+' oggi · '+S.lot.length+' totali')}${T('abb',IC.abb,'Abbattimento',S.abb.length+' schede')}${T('mag',IC.mag,'Magazzino',sc?'<b class=warn>'+sc+' in scadenza</b>':S.mag.length+' carichi')}<button class="tile t-cal" onclick="go('cal')" style="grid-column:1/-1"><div style="display:flex;gap:12px;align-items:flex-start;justify-content:space-between"><div style="flex:1;min-width:0"><span>${IC.cal}</span>Calendario<i>${cal().filter(x=>!x.fatto&&x.data>=t).length} eventi in programma</i>${calToday()}</div><div style="width:128px;flex:0 0 128px">${calMini()}</div></div></button><button class="tile t-tem" onclick="go('tem')" style="grid-column:1/-1"><span>${IC.tem}</span>Temperature<i>${tem().filter(x=>x.data==td()).length} letture oggi${tem().filter(x=>x.data==td()&&fuori(x)).length?' · '+tem().filter(x=>x.data==td()&&fuori(x)).length+' fuori range':''}</i>${(()=>{const m=strs().filter(q=>!tem().some(x=>x.data==td()&&x.strumento==q.nome)).map(q=>q.nome);return m.length?`<div style="margin-top:8px;color:#FF7A6B;font:600 15px Inter,system-ui,sans-serif">⚠ Da leggere oggi: ${e(m.join(', '))}</div>`:''})()}</button></div>
<div class="row" style="margin-top:16px"><button class="g" style="flex:1" onclick="go('spe')">Spese ›</button><button class="g" style="flex:1" onclick="go('bk')">Impostazioni ›</button></div>`},
fc:id=>{if(id)return bar('Food cost')+fcDet(id);return bar('Food cost','<p class="s">Costo calcolato sui prezzi dei carichi in magazzino.</p>')+(S.ric.length?S.ric.map(fcCard).join(''):'<p class="s">Nessuna ricetta. Creane una prima.</p>')},

cal:()=>bar('Calendario')+`<div class="c"><div class="row" style="justify-content:space-between;align-items:center"><button class="g" style="min-height:0;padding:6px 14px" onclick="calNav(-1)">‹</button><b id="cmt">${calTitle()}</b><button class="g" style="min-height:0;padding:6px 14px" onclick="calNav(1)">›</button></div><div id="cg">${calGrid()}</div></div><div style="text-align:center;margin-top:12px"><button class="g" style="min-height:0;padding:6px 14px;font-size:13px" onclick="go('calF')">+ Nuovo evento</button></div><div id="cdl" style="margin-top:10px">${calDayList()}</div>`,

calF:id=>{const x=cal().find(y=>y.id==id)||{};const types=['Appuntamento','Scadenza','Ordine da produrre'];return bar(id?'Modifica evento':'Nuovo evento')+`<div class="c">${F('Titolo','ct',x.titolo||'')}<label>Tipo<select id="ctp">${types.map(t=>`<option ${t==(x.tipo||'Appuntamento')?'selected':''}>${t}</option>`).join('')}</select></label>${F('Data','cdt',x.data||calDay(),'date')}${F('Ora (facoltativa)','cora',x.ora||'','time')}<label>Note<textarea id="cn">${e(x.note||'')}</textarea></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cf" ${x.fatto?'checked':''} style="width:auto;margin:0"> Fatto</label><div class="row"><button onclick="saveCal('${id||''}')">${id?'Salva modifiche':'Aggiungi evento'}</button><button class="g" onclick="go('cal')">Annulla</button></div>${id?`<button class="g" style="margin-top:10px;color:#FF7A6B;border-color:#FF7A6B" onclick="delCal('${id}')">Elimina evento</button>`:''}</div>`},

tem:()=>bar('Registro temperature',`<button onclick="go('temF')">+ Nuova lettura</button><button class="g" onclick="go('temS')">Strumenti</button><button class="g" onclick="prTem()">Stampa registro</button>`)+`<div class="c"><label style="margin-top:0">Mese<input type="month" value="${temM()}" onchange="TM=this.value||td().slice(0,7);temL()" style="margin:0"></label></div><div id="tl" style="margin-top:10px">${temBody()}</div>`,

temF:id=>{const x=tem().find(y=>y.id==id)||{};const hdr=F('Data','td_',x.data||td(),'date')+F('Ora','to_',x.ora||new Date().toTimeString().slice(0,5),'time')+F('Operatore','top_',x.op||'');if(id)return bar('Modifica lettura')+`<div class="c">${hdr}<label>Strumento<select id="ts_">${strs().map(s=>`<option ${s.nome==x.strumento?'selected':''}>${e(s.nome)}</option>`).join('')}</select></label>${F('Temperatura (°C)','tv_',x.temp??'','number')}<div class="row"><button onclick="saveTem('${id}')">Salva modifiche</button><button class="g" onclick="go('tem')">Annulla</button></div><button class="g" style="margin-top:10px;color:#FF7A6B;border-color:#FF7A6B" onclick="delTem('${id}')">Elimina lettura</button></div>`;return bar('Nuova lettura')+`<div class="c">${hdr}<p class="s">Inserisci la temperatura di ogni strumento. Lascia vuoti quelli non controllati.</p>${strs().map((s,i)=>`<label>${e(s.nome)} <span class="s">(${nf(s.min)} / ${nf(s.max)} °C)</span><input id="tv${i}" type="number" step="0.1" value=""></label>`).join('')}<div class="row"><button onclick="saveTem('')">Registra letture</button><button class="g" onclick="go('tem')">Annulla</button></div></div>`},

temS:()=>bar('Strumenti')+strs().map((s,i)=>`<div class="c"><input value="${e(s.nome)}" onchange="upStr(${i},'nome',this.value)" style="margin:0"><div class="row" style="justify-content:center"><label style="flex:1">Min °C<input type="number" step="0.1" value="${s.min}" onchange="upStr(${i},'min',this.value)" style="margin:0"></label><label style="flex:1">Max °C<input type="number" step="0.1" value="${s.max}" onchange="upStr(${i},'max',this.value)" style="margin:0"></label></div><button class="g" style="margin-top:8px;color:#FF7A6B;border-color:#FF7A6B" onclick="delStr(${i})">Elimina strumento</button></div>`).join('')+`<button onclick="addStr()">+ Aggiungi strumento</button><p class="s">Il range serve a segnare le letture fuori dai limiti.</p>`,

spe:()=>bar('Spese',`<button onclick="go('speF')">+ Nuova spesa</button><button class="g" onclick="prSpe()">Stampa riepilogo</button>`)+`<div class="c"><label style="margin-top:0">Mese<input type="month" value="${speM()}" onchange="SM=this.value||td().slice(0,7);speL()"></label></div><div id="sl">${speBody()}</div>`,

speF:id=>{const x=spe().find(y=>y.id==id)||{};return bar(id?'Modifica spesa':'Nuova spesa')+`<div class="c">${F('Data','sd',x.data||td(),'date')}<label>Categoria<select id="sc">${CATS.map(c=>`<option ${c==(x.cat||'Altro')?'selected':''}>${c}</option>`).join('')}</select></label>${F('Descrizione','sx',x.descr||'')}${F('Fornitore','sf',x.forn||'')}${F('Importo (€)','si',x.importo??'','number')}<div class="row"><button onclick="saveSpe('${id||''}')">${id?'Salva modifiche':'Registra spesa'}</button><button class="g" onclick="go('spe')">Annulla</button></div>${id?`<button class="g" style="margin-top:10px;color:#FF7A6B;border-color:#FF7A6B" onclick="delSpe('${id}')">Elimina spesa</button>`:''}</div>`},

bk:()=>bar('Impostazioni')+`<div class="c"><label style="margin-top:0">Nome azienda (compare su schede ed etichette)<input id="az" value="${e(S.azienda||'')}" onchange="S.azienda=this.value.trim();save()" style="margin:0"></label></div><h2 style="font-size:20px;margin-top:20px">Copia di sicurezza</h2><div class="c"><p class="s">I dati sono già salvati in questo browser. Con la copia di sicurezza ottieni un file da conservare nel dispositivo o da spostare su un altro.</p><div class="row"><button onclick="bk()">Salva copia sul dispositivo</button><button class="g" onclick="$('#rf').click()">Ripristina da file</button></div><input id="rf" type="file" accept=".json" style="display:none" onchange="rs(this)"></div>`,

ric:()=>bar('Ricette',`<button onclick="go('ricF')">+ Nuova ricetta</button><button class="g" onclick="go('fc')">Food cost</button>`)+(S.ric.map(r=>`<div class="c"><b>${e(r.nome)}</b> <span class="tag">${e(r.sigla)}</span><div class="s">${r.ingr.length} ingredienti · base ${nf(r.rif)} kg</div><div class="row"><button onclick="go('ricU','${r.id}')">Produci</button><button class="g" onclick="go('ricF','${r.id}')">Modifica</button><button class="g" style="color:#FF7A6B;border-color:#FF7A6B" onclick="delRic('${r.id}')">Elimina</button></div></div>`).join('')||'<p class="s">Nessuna ricetta. Inserisci la tua prima ricetta.</p>'),

ricF:id=>{const r=S.ric.find(x=>x.id==id)||{ingr:[]};
return bar(id?'Modifica ricetta':'Nuova ricetta')+`<div class="c">${F('Nome prodotto','rn',r.nome)}${F('Sigla (es. PF)','rs',r.sigla)}${F('Impasto di riferimento (kg)','rr',r.rif||1,'number')}${F('Prezzo di vendita (€/kg, facoltativo)','rpv',r.pv??'','number')}
<label>Ingredienti</label><div id="il">${(r.ingr.length?r.ingr:[{}]).map(ingRow).join('')}</div>
<datalist id="ingdl">${[...new Set(S.mag.map(m=>m.nome))].map(n=>`<option value="${e(n)}">`).join('')}</datalist>
<button type="button" class="g" onclick="addIng()">+ Aggiungi ingrediente</button>
<label>Procedimento<textarea id="rp">${e(r.proc)}</textarea></label>
<div class="row"><button onclick="saveRic('${id||''}')">Salva ricetta</button><button class="g" onclick="go('ric')">Annulla</button></div></div>`},

ricU:id=>{const r=S.ric.find(x=>x.id==id);
return bar('Produci '+e(r.nome))+`<div class="c">${F('Quanti kg di prodotto?','kg','','number')}${F('Data di scadenza','sc','','date')}${F('Operatore','op')}
<div class="tw" id="pv"></div><div class="row"><button onclick="mkLot('${id}')">Conferma e crea lotto</button><button class="g" onclick="go('ric')">Annulla</button></div></div>
<script>document.getElementById('kg').oninput=()=>{const f=(+val('kg')||0)/${r.rif};$('#pv').innerHTML='<table>'+S.ric.find(x=>x.id=='${id}').ingr.map(i=>'<tr><td>'+e(i.n)+'</td><td><b>'+nf(i.q*f)+' '+i.u+'</b></td></tr>').join('')+'</table>'}<\/script>`},

lot:()=>bar('Lotti di produzione')+`<div class="row" style="align-items:center;gap:8px;margin:6px 0"><span class="s" style="margin:0">Mese</span><input id="lm" type="month" value="${td().slice(0,7)}" style="width:auto;margin:0;padding:6px 10px;font-size:14px;min-height:0"><button class="g" onclick="prMeseLot()">Stampa tabella</button></div>`+`<input id="q" placeholder="Cerca prodotto, lotto, operatore, materia prima…" oninput="fl()" value="${e(window.LQ||'')}"><div id="ll" style="margin-top:10px">${lotList(window.LQ||'')}</div>`,

lotV:id=>{const l=S.lot.find(x=>x.id==id);const ab=S.abb.filter(a=>a.lotId==id);
return bar(e(l.code))+`<div class="c"><b>${e(l.nome)}</b><div class="s">Prodotto ${df(l.prod)} · scade ${df(l.scad)} · ${nf(l.kg)} kg</div>
<div class="tw"><table><tr><th>Ingrediente</th><th>Quantità</th><th>Lotto fornitore</th></tr>${l.ingr.map((i,k)=>`<tr><td>${e(i.n)}${i.al?' <span class=tag>allergene</span>':''}</td><td>${nf(i.q)} ${i.u}</td><td><input id="lf${k}" value="${e(i.lf)}" ${l.scaricato?'disabled':''}>${l.scaricato?'':lfHints(i.n,k)}</td></tr>`).join('')}</table></div>
${F('Operatore','lo',l.op)}<label>Annotazioni<textarea id="ln">${e(l.note)}</textarea></label>
<label>Ingredienti in etichetta (separati da virgola, modificabili)<textarea id="le">${e(l.etich)}</textarea></label>
<label>Formato etichetta<select id="lz"><option value="60x40">60 × 40 mm</option><option value="80x50">80 × 50 mm</option><option value="100x60">100 × 60 mm</option></select></label>
<div class="row"><button onclick="saveLot('${id}');go('home')">Salva scheda</button><button onclick="prScheda('${id}')">Stampa scheda</button><button onclick="prEt('${id}')">Stampa etichetta</button></div>
<div class="row"><button class="g" onclick="scarica('${id}')" ${l.scaricato?'disabled':''}>${l.scaricato?'Magazzino già scaricato':'Scarica magazzino'}</button><button class="g" onclick="go('abbF','${id}')">Nuovo abbattimento</button><button class="g" style="color:#FF7A6B;border-color:#FF7A6B" onclick="delLot('${id}')">Elimina lotto</button></div></div>
<h2>Abbattimenti collegati</h2>${ab.map(a=>`<div class="c">${a.tipo} · ${df(a.data)} · ${nf(a.temp)} °C · ${e(a.op)}</div>`).join('')||'<p class="s">Nessuno.</p>'}`},

abb:()=>bar('Abbattimento',`<button onclick="go('abbF')">+ Nuova scheda</button><input id="q" placeholder="Cerca prodotto o lotto" oninput="fa()">`)+`<div class="row" style="align-items:center;gap:8px;margin:6px 0"><span class="s" style="margin:0">Mese</span><input id="am" type="month" value="${td().slice(0,7)}" style="width:auto;margin:0;padding:6px 10px;font-size:14px;min-height:0"><button class="g" onclick="prMeseAbb()">Stampa tabella</button></div>`+'<div id="al" style="margin-top:10px">'+abbList('')+'</div>',

abbF:id=>{const l=S.lot.find(x=>x.id==id);
return bar('Scheda di abbattimento')+`<div class="c"><label>Prodotto<input id="ap" readonly value="${e(l?l.nome:'')}"></label>
<label>Lotto personale<input id="al" list="dl" value="${e(l?l.code:'')}" oninput="pick()" placeholder="Cerca lotto"></label><datalist id="dl">${S.lot.map(x=>`<option value="${e(x.code)}">`).join('')}</datalist>
<label>Tipo di abbattimento<select id="at"><option>Positivo</option><option>Negativo</option></select></label>${F('Data abbattimento','ad',td(),'date')}${F('Temperatura (°C)','atp','','number')}${F('Operatore','ao')}
<div class="row"><button onclick="saveAbb()">Salva scheda</button><button class="g" onclick="go('abb')">Annulla</button></div></div>`},

mag:()=>bar('Magazzino materie prime',`<button onclick="go('magF')">+ Nuovo carico</button><button class="g" onclick="prInv()">Stampa inventario</button>`)+`<div class="c"><input placeholder="Cerca per nome, fornitore o lotto" value="${e(MQ)}" oninput="MQ=this.value;magL()" style="margin:0"><select style="margin-top:8px" onchange="MF=this.value;magL()">${[['tutti','Tutti'],['scad','In scadenza (7 giorni)'],['scaduti','Scaduti'],['esauriti','Esauriti']].map(([v,n])=>`<option value="${v}" ${MF==v?'selected':''}>${n}</option>`).join('')}</select><div class="s" id="mt">${magSum()}</div></div><div id="ml" style="margin-top:10px">${S.mag.length?magRows():'<p class="s">Nessun carico registrato.</p>'}</div>`,

magF:id=>{const m=S.mag.find(x=>x.id==id)||{};return bar(id?'Modifica carico':'Nuovo carico')+`<div class="c">${F('Materia prima','mn',m.nome||'')}${F('Fornitore','mf',m.forn||'')}${F(id?'Giacenza attuale':'Quantità','mq',m.q??'','number')}<label>Unità di misura${U('mu',m.u||'kg')}</label>${F('Lotto fornitore','ml',m.lotto||'')}${F('Data di carico','mc',m.carico||td(),'date')}${F('Data di scadenza','ms',m.scad||'','date')}${F('Prezzo per unità (€ per kg, l o pz)','mp',m.prezzo??'','number')}<div class="row"><button onclick="saveMag('${id||''}')">${id?'Salva modifiche':'Registra carico'}</button><button class="g" onclick="go('mag')">Annulla</button></div>${id?`<button class="g" style="margin-top:10px;color:#FF7A6B;border-color:#FF7A6B" onclick="delMag('${id}')">Elimina carico</button>`:''}</div>`}
};

function render(){$('#app').innerHTML=`<header><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h1>FRESH PASTA LAB</h1></div><svg class="wh" viewBox="0 0 24 24"><path d="M12 21V8M12 8c-2-.5-3-2-3-4 2 .5 3 2 3 4zM12 8c2-.5 3-2 3-4-2 .5-3 2-3 4zM12 13c-2-.5-3.5-2-3.5-4 2 .5 3.5 2 3.5 4zM12 13c2-.5 3.5-2 3.5-4-2 .5-3.5 2-3.5 4zM12 18c-2-.5-3.5-2-3.5-4 2 .5 3.5 2 3.5 4zM12 18c2-.5 3.5-2 3.5-4-2 .5-3.5 2-3.5 4z"/></svg></div></header><main>${V!='home'?`<button class="g" onclick="go('${['lotV'].includes(V)?'lot':['ricF','ricU'].includes(V)?'ric':['abbF'].includes(V)?'abb':['magF'].includes(V)?'mag':'home'}')">‹ Indietro</button>`:''}${views[V](P)}</main>`;
 if(V=='ricU'){const s=document.createElement('script');s.textContent=document.querySelector('#app script')?.textContent;}}
const _r=render;render=function(){_r();const sc=$('#app main script');if(sc){const t=sc.textContent;sc.remove();new Function(t)()}};

function ingRow(i={}){return `<div class="ing"><input class="in" placeholder="Ingrediente (es. Farina)" list="ingdl" value="${e(i.n)}"><div class="ir"><input class="iq" type="number" inputmode="decimal" step="any" min="0" placeholder="Quantità" value="${i.q!=null?e(i.q):''}"><select class="iu">${UN.map(u=>`<option ${u==(i.u||'g')?'selected':''}>${u}</option>`).join('')}</select><label class="ia"><input type="checkbox" class="ial" ${i.al?'checked':''}> Allergene</label><button type="button" class="g ix" aria-label="Rimuovi ingrediente" onclick="this.closest('.ing').remove()">✕</button></div></div>`}
function addIng(){const l=$('#il');l.insertAdjacentHTML('beforeend',ingRow());l.lastElementChild.querySelector('.in').focus()}
const mese=m=>{const[y,mm]=m.split('-');return new Date(y,mm-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})};
const TS='width:100%;font-size:12px';
function prMeseLot(){const m=val('lm');if(!m)return alert('Scegli il mese.');
const L=S.lot.filter(l=>(l.prod||'').slice(0,7)==m).sort((a,b)=>a.prod.localeCompare(b.prod)||a.code.localeCompare(b.code));
if(!L.length)return alert('Nessun lotto in questo mese.');
pr(`${azH()}<h2>Lotti di produzione · ${mese(m)}</h2><table border=1 cellspacing=0 cellpadding=5 style="${TS}"><tr><th>Data</th><th>Lotto</th><th>Prodotto</th><th>Kg</th><th>Scadenza</th><th>Operatore</th><th>Ingredienti (lotto fornitore)</th></tr>${L.map(l=>`<tr><td>${df(l.prod)}</td><td>${e(l.code)}</td><td>${e(l.nome)}</td><td>${nf(l.kg)}</td><td>${df(l.scad)}</td><td>${e(l.op)}</td><td>${l.ingr.map(i=>e(i.n)+(i.lf?' ('+e(i.lf)+')':'')).join(', ')}</td></tr>`).join('')}</table>`,'Lotti '+m,'@page{size:A4 landscape;margin:10mm}body{margin:0}th{background:#eee}')}
function prMeseAbb(){const m=val('am');if(!m)return alert('Scegli il mese.');
const A=S.abb.filter(a=>(a.data||'').slice(0,7)==m).sort((a,b)=>a.data.localeCompare(b.data)||a.code.localeCompare(b.code));
if(!A.length)return alert('Nessun abbattimento in questo mese.');
pr(`${azH()}<h2>Abbattimenti · ${mese(m)}</h2><table border=1 cellspacing=0 cellpadding=5 style="${TS}"><tr><th>Data</th><th>Lotto</th><th>Prodotto</th><th>Tipo</th><th>Temperatura (°C)</th><th>Operatore</th></tr>${A.map(a=>`<tr><td>${df(a.data)}</td><td>${e(a.code)}</td><td>${e(a.prodotto)}</td><td>${e(a.tipo)}</td><td>${nf(a.temp)}</td><td>${e(a.op)}</td></tr>`).join('')}</table>`,'Abbattimenti '+m,'@page{size:A4 landscape;margin:10mm}body{margin:0}th{background:#eee}')}
async function delLot(id){const l=S.lot.find(x=>x.id==id);if(!l)return;
if(await ask('Eliminare il lotto '+l.code+'?'+(l.scaricato?'\n\nIl magazzino già scaricato NON viene ripristinato.':'')+'\n\nLe schede di abbattimento collegate restano archiviate.')){S.lot=S.lot.filter(x=>x.id!=id);save();go('lot')}}
async function delAbb(id){if(await ask('Eliminare questa scheda di abbattimento?')){S.abb=S.abb.filter(x=>x.id!=id);save();render()}}
async function delRic(id){if(await ask('Eliminare la ricetta? I lotti già creati restano archiviati.')){S.ric=S.ric.filter(r=>r.id!=id);save();render()}}
function saveRic(id){const nome=val('rn').trim(),sigla=val('rs').trim().toUpperCase();if(!nome||!sigla||!(+val('rr')>0))return alert('Inserisci nome, sigla e impasto di riferimento.');
const ingr=[...document.querySelectorAll('#il .ing')].map(d=>({n:d.querySelector('.in').value.trim(),q:parseFloat(String(d.querySelector('.iq').value).replace(',','.'))||0,u:d.querySelector('.iu').value,al:d.querySelector('.ial').checked})).filter(x=>x.n);
if(!ingr.length)return alert('Aggiungi almeno un ingrediente.');
const r={id:id||uid(),nome,sigla,rif:+val('rr'),ingr,proc:val('rp'),pv:+val('rpv')||0};
if(id)S.ric=S.ric.map(x=>x.id==id?r:x);else S.ric.push(r);save();go('ric')}
function mkLot(rid){const r=S.ric.find(x=>x.id==rid),kg=+val('kg');if(!(kg>0))return alert('Indica quanti kg vuoi produrre.');if(!val('sc'))return alert('Indica la data di scadenza.');
const d=new Date(),p=n=>String(n).padStart(2,'0'),pre='L '+r.sigla+p(d.getDate())+p(d.getMonth()+1)+p(d.getFullYear()%100)+'-';
const n=Math.max(0,...S.lot.filter(l=>l.code.startsWith(pre)).map(l=>parseInt(l.code.slice(pre.length))||0))+1,f=kg/r.rif;
const l={id:uid(),code:pre+String(n).padStart(3,'0'),rid,nome:r.nome,kg,prod:td(),scad:val('sc'),op:val('op'),note:'',scaricato:false,ingr:r.ingr.map(i=>({...i,q:i.q*f,lf:''})),etich:r.ingr.map(i=>i.n).join(', ')};
S.lot.push(l);save();go('lotV',l.id)}
function lotList(q){q=q.toLowerCase();const m=S.lot.filter(l=>[l.code,l.nome,l.op,l.prod,df(l.prod),...l.ingr.map(i=>i.n+' '+i.lf)].join(' ').toLowerCase().includes(q));
return m.slice().reverse().map(l=>`<div class="c" onclick="go('lotV','${l.id}')"><b>${e(l.code)}</b> ${e(l.nome)}<div class="s">${df(l.prod)} · scade ${df(l.scad)} · ${e(l.op)}</div></div>`).join('')||'<p class="s">Nessun lotto trovato.</p>'}
function fl(){window.LQ=val('q');$('#ll').innerHTML=lotList(window.LQ)}
function lfHints(name,k){const L=S.mag.filter(m=>m.nome.toLowerCase()==(name||'').toLowerCase()&&m.lotto&&m.q>0).sort((a,b)=>(b.carico||'').localeCompare(a.carico||''));const seen=new Set();const U=L.filter(m=>seen.has(m.lotto)?false:(seen.add(m.lotto),true));if(!U.length)return '<div class="s">Nessun lotto disponibile in magazzino per questo ingrediente.</div>';return '<div class="s" style="margin-top:6px">Dal magazzino:</div><div class="row" style="gap:6px">'+U.map(m=>`<button type="button" class="g" style="padding:3px 8px;min-height:0;font-size:12px;line-height:1.3;border-radius:10px" data-v="${e(m.lotto)}" title="Giacenza ${nf(m.q)} ${m.u}" onclick="document.getElementById('lf${k}').value=this.dataset.v">${e(m.lotto)}</button>`).join('')+'</div>'}
function azH(){return S.azienda?`<p style="margin:0 0 8px;font-weight:700;font-size:16px">${e(S.azienda)}</p>`:''}
function azL(){return S.azienda?`<div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px">${e(S.azienda)}</div>`:''}
function saveLot(id,q){const l=S.lot.find(x=>x.id==id);if(!l.scaricato)l.ingr.forEach((i,k)=>i.lf=val('lf'+k).trim());l.op=val('lo');l.note=val('ln');l.etich=val('le');save();if(!q)alert('Scheda salvata.')}
function prScheda(id){saveLot(id,1);const l=S.lot.find(x=>x.id==id);pr(`${azH()}<h2>Scheda di produzione ${e(l.code)}</h2><p><b>${e(l.nome)}</b><br>Produzione ${df(l.prod)} · Scadenza ${df(l.scad)}<br>Quantità prodotta: ${nf(l.kg)} kg · Operatore: ${e(l.op)}</p><table border=1 cellspacing=0 cellpadding=5 style="width:100%"><tr><th>Ingrediente</th><th>Quantità</th><th>Lotto fornitore</th></tr>${l.ingr.map(i=>`<tr><td>${e(i.n)}</td><td>${nf(i.q)} ${i.u}</td><td>${e(i.lf)}</td></tr>`).join('')}</table><p>Annotazioni: ${e(l.note)}</p>`,'Scheda produzione '+l.code)}
function prEt(id){saveLot(id,1);const l=S.lot.find(x=>x.id==id),[w,h]=val('lz').split('x'),al=l.ingr.filter(i=>i.al).map(i=>i.n.toLowerCase());
const ing=l.etich.split(',').map(x=>x.trim()).filter(Boolean).map(x=>al.includes(x.toLowerCase())?`<b><u>${e(x.toUpperCase())}</u></b>`:e(x)).join(', ');
pr(`<div class="lab" style="width:${w}mm;min-height:${h}mm">${azL()}<h3>${e(l.nome)}</h3>Lotto: <b>${e(l.code)}</b><br>Prodotto il: ${df(l.prod)} · Da consumare entro: <b>${df(l.scad)}</b><br><br>Ingredienti: ${ing}</div>`,'Etichetta '+l.code,`@page{size:${w}mm ${h}mm;margin:0}body{margin:0;padding:2mm;box-sizing:border-box}`)}
async function scarica(id){const l=S.lot.find(x=>x.id==id);saveLot(id,1);const R=l.ingr.map(i=>{const m=S.mag.find(m=>m.nome.toLowerCase()==i.n.toLowerCase()&&m.lotto==i.lf);return{i,m,q:m?conv(i.q,i.u,m.u):null}});
const bad=R.filter(r=>!r.m||r.q==null||r.q>r.m.q);
if(bad.length)return alert('Scarico bloccato, verifica:\n'+bad.map(r=>'• '+r.i.n+(r.m?' (giacenza insufficiente o unità non compatibile)':' (lotto fornitore non trovato in magazzino)')).join('\n'));
if(await ask('Riepilogo scarico:\n'+R.map(r=>`${r.i.n} · lotto ${r.i.lf} · scarico ${nf(r.q)} ${r.m.u} · giacenza ${nf(r.m.q)} ${r.m.u}`).join('\n')+'\n\nConfermi?')){R.forEach(r=>r.m.q=Math.round((r.m.q-r.q)*1e6)/1e6);l.scaricato=true;save();render()}}
function abbList(q){q=q.toLowerCase();return S.abb.filter(a=>(a.prodotto+' '+a.code).toLowerCase().includes(q)).slice().reverse().map(a=>`<div class="c"><b>${e(a.code)}</b> ${e(a.prodotto)}<div class="s">${a.tipo} · ${df(a.data)} · ${nf(a.temp)} °C · ${e(a.op)}</div><button class="g" onclick="prAbb('${a.id}')">Stampa etichetta</button><button class="g" style="color:#FF7A6B;border-color:#FF7A6B" onclick="delAbb('${a.id}')">Elimina</button></div>`).join('')||'<p class="s">Nessuna scheda trovata.</p>'}
function fa(){$('#al').innerHTML=abbList(val('q'))}
function pick(){const l=S.lot.find(x=>x.code==val('al'));$('#ap').value=l?l.nome:''}
function saveAbb(){const l=S.lot.find(x=>x.code==val('al'));if(!l)return alert('Seleziona un lotto esistente.');if(val('atp')==='')return alert('Inserisci la temperatura.');
S.abb.push({id:uid(),lotId:l.id,code:l.code,prodotto:l.nome,tipo:val('at'),data:val('ad'),temp:+val('atp'),op:val('ao')});save();go('home')}
function prAbb(id){const a=S.abb.find(x=>x.id==id);pr(`${azH()}<h2>Scheda di abbattimento</h2><p>Prodotto: <b>${e(a.prodotto)}</b><br>Lotto personale: <b>${e(a.code)}</b><br>Tipo: ${a.tipo}<br>Data: ${df(a.data)}<br>Temperatura: ${nf(a.temp)} °C<br>Operatore: ${e(a.op)}</p>`,'Abbattimento '+a.code)}
let MQ='',MF='tutti';
function magSum(){const in7=new Date(Date.now()+7*864e5).toISOString().slice(0,10),t=td();const sc=S.mag.filter(m=>m.q>0&&m.scad&&m.scad>=t&&m.scad<=in7).length,sd=S.mag.filter(m=>m.q>0&&m.scad&&m.scad<t).length,es=S.mag.filter(m=>m.q<=0).length;return S.mag.length+' carichi · '+sc+' in scadenza · '+sd+' scaduti · '+es+' esauriti'}
function magRows(){const in7=new Date(Date.now()+7*864e5).toISOString().slice(0,10),t=td(),q=MQ.trim().toLowerCase();
let L=S.mag.filter(m=>(m.nome+' '+m.forn+' '+m.lotto).toLowerCase().includes(q));
if(MF=='scad')L=L.filter(m=>m.q>0&&m.scad&&m.scad>=t&&m.scad<=in7);
if(MF=='scaduti')L=L.filter(m=>m.q>0&&m.scad&&m.scad<t);
if(MF=='esauriti')L=L.filter(m=>m.q<=0);
L.sort((a,b)=>a.nome.localeCompare(b.nome));
return L.map(m=>{const st=m.q<=0?'<b>Esaurito</b>':(m.scad&&m.scad<t)?'<b class="warn">Scaduto</b>':(m.scad&&m.scad<=in7)?'<b class="warn">In scadenza</b>':'';return `<div class="c" onclick="go('magF','${m.id}')"><b>${e(m.nome)}</b><div class="s">${e(m.forn)} · lotto ${e(m.lotto)} · carico ${df(m.carico)}</div><div class="row" style="justify-content:space-between;align-items:baseline"><span><b>${nf(m.q)} ${m.u}</b></span><span class="s">scade ${df(m.scad)}</span></div>${st?`<div class="s">${st}</div>`:''}</div>`}).join('')||'<p class="s">Nessun prodotto trovato.</p>'}
function magL(){$('#ml').innerHTML=magRows();$('#mt').innerHTML=magSum()}
function prInv(){if(!S.mag.length)return alert('Il magazzino è vuoto.');const t=td();pr(`${azH()}<h2>Inventario magazzino · ${df(t)}</h2><table border=1 cellspacing=0 cellpadding=5 style="width:100%;font-size:12px"><tr><th>Materia prima</th><th>Fornitore</th><th>Lotto</th><th>Giacenza</th><th>Scadenza</th></tr>${[...S.mag].sort((a,b)=>a.nome.localeCompare(b.nome)).map(m=>`<tr><td>${e(m.nome)}</td><td>${e(m.forn)}</td><td>${e(m.lotto)}</td><td>${nf(m.q)} ${m.u}</td><td>${df(m.scad)}</td></tr>`).join('')}</table>`,'Inventario '+t,'@page{size:A4 landscape;margin:10mm}body{margin:0}th{background:#eee}')}
async function delMag(id){const m=S.mag.find(x=>x.id==id);if(m&&await ask('Eliminare il carico di '+m.nome+' (lotto '+m.lotto+')?')){S.mag=S.mag.filter(x=>x.id!=id);save();go('mag')}}
let SM='';
const CATS=['Materie prime','Packaging','Energia e utenze','Affitto','Attrezzatura','Trasporto','Manutenzione','Pulizie e igiene','Consulenze','Altro'];
function spe(){return S.spe||(S.spe=[])}
function speM(){return SM||td().slice(0,7)}
function speMese(){const M=speM();return spe().filter(x=>(x.data||'').slice(0,7)==M).sort((a,b)=>b.data.localeCompare(a.data))}
function catTot(){const m={};speMese().forEach(x=>{m[x.cat]=(m[x.cat]||0)+x.importo});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function speBody(){const L=speMese(),tot=L.reduce((a,x)=>a+x.importo,0);return `<div class="c"><div class="s">Totale ${mese(speM())}</div><div style="font-size:24px;font-weight:700">€ ${nf(Math.round(tot*100)/100)}</div>${catTot().map(([c,v])=>`<div class="row" style="justify-content:space-between"><span>${e(c)}</span><span>€ ${nf(Math.round(v*100)/100)}</span></div>`).join('')}</div>`+(L.map(x=>`<div class="c" onclick="go('speF','${x.id}')"><b>${e(x.descr)}</b> <span class="tag">${e(x.cat)}</span><div class="s">${df(x.data)}${x.forn?' · '+e(x.forn):''}</div><b>€ ${nf(x.importo)}</b></div>`).join('')||'<p class="s">Nessuna spesa in questo mese.</p>')}
function speL(){$('#sl').innerHTML=speBody()}
function prSpe(){const L=speMese();if(!L.length)return alert('Nessuna spesa in questo mese.');const tot=L.reduce((a,x)=>a+x.importo,0);pr(`${azH()}<h2>Riepilogo spese · ${mese(speM())}</h2><table border=1 cellspacing=0 cellpadding=5 style="width:100%;font-size:12px"><tr><th>Data</th><th>Categoria</th><th>Descrizione</th><th>Fornitore</th><th>Importo</th></tr>${L.slice().reverse().map(x=>`<tr><td>${df(x.data)}</td><td>${e(x.cat)}</td><td>${e(x.descr)}</td><td>${e(x.forn)}</td><td>€ ${nf(x.importo)}</td></tr>`).join('')}</table><h3>Totali per categoria</h3><table border=1 cellspacing=0 cellpadding=5 style="width:50%;font-size:12px">${catTot().map(([c,v])=>`<tr><td>${e(c)}</td><td>€ ${nf(Math.round(v*100)/100)}</td></tr>`).join('')}</table><p><b>Totale: € ${nf(Math.round(tot*100)/100)}</b></p>`,'Spese '+speM(),'@page{size:A4;margin:10mm}body{margin:0}th{background:#eee}')}
function saveSpe(id){const d={data:val('sd'),cat:val('sc'),descr:val('sx').trim(),forn:val('sf').trim(),importo:+val('si')};if(!d.data||!d.descr||val('si')===''||d.importo<0)return alert('Inserisci data, descrizione e importo.');if(id){const x=spe().find(y=>y.id==id);if(x)Object.assign(x,d)}else spe().push({id:uid(),...d});SM=d.data.slice(0,7);save();go('spe')}
async function delSpe(id){const x=spe().find(y=>y.id==id);if(x&&await ask('Eliminare la spesa "'+x.descr+'" di € '+nf(x.importo)+'?')){S.spe=spe().filter(y=>y.id!=id);save();go('spe')}}
const r2=x=>Math.round(x*100)/100;
function fcCalc(r){const rows=r.ingr.map(i=>{const cand=S.mag.filter(m=>m.nome.toLowerCase()==i.n.toLowerCase()).sort((a,b)=>((b.q>0)-(a.q>0))||(b.carico||'').localeCompare(a.carico||''));const m=cand[0];if(!m)return{i,m:null,err:'Non presente in magazzino'};if(!(+m.prezzo>0))return{i,m,err:'Prezzo non inserito'};const qc=conv(i.q,i.u,m.u);if(qc==null)return{i,m,err:'Unità non compatibile'};return{i,m,cost:qc*m.prezzo}});
const ok=rows.every(x=>x.cost!=null),tot=rows.reduce((a,x)=>a+(x.cost||0),0),kg=+r.rif||1,perKg=tot/kg,pct=r.pv>0?perKg/r.pv*100:null;return{rows,ok,tot,perKg,pct}}
function fcCard(r){const c=fcCalc(r);return `<div class="c" onclick="go('fc','${r.id}')"><b>${e(r.nome)}</b> <span class="tag">${e(r.sigla)}</span><div class="s">Costo al kg: € ${nf(r2(c.perKg))}${c.pct!=null?' · food cost '+nf(r2(c.pct))+'%':' · prezzo di vendita non impostato'}</div>${c.ok?'':'<div class="s"><b class="warn">Dati mancanti, costo incompleto</b></div>'}</div>`}
function fcHtml(r,c){return `<div class="c"><div class="s">Costo impasto di ${nf(r.rif)} kg</div><div style="font-size:22px;font-weight:700">€ ${nf(r2(c.tot))}</div><div class="s">Costo al kg: € ${nf(r2(c.perKg))}</div><div class="s">Prezzo di vendita: ${r.pv>0?'€ '+nf(r.pv)+'/kg':'non impostato'}</div><div style="font-size:18px;font-weight:700">Food cost: ${c.pct!=null?nf(r2(c.pct))+'%':'—'}</div>${c.ok?'':'<p class="s"><b class="warn">Alcuni ingredienti non sono calcolabili: il costo è parziale.</b></p>'}</div><div class="tw"><table><tr><th>Ingrediente</th><th>Quantità</th><th>Prezzo</th><th>Costo</th></tr>${c.rows.map(x=>`<tr><td>${e(x.i.n)}</td><td>${nf(x.i.q)} ${x.i.u}</td><td>${x.m&&x.m.prezzo>0?'€ '+nf(x.m.prezzo)+'/'+x.m.u:'—'}</td><td>${x.cost!=null?'€ '+nf(r2(x.cost)):'<span class="warn">'+x.err+'</span>'}</td></tr>`).join('')}</table></div><p class="s">Il prezzo è quello del carico più recente con giacenza disponibile. Le quantità della ricetta si riferiscono all'impasto di riferimento.</p><div class="row"><button class="g" onclick="go('ricF','${r.id}')">Modifica prezzo di vendita</button></div>`}
function fcDet(id){const r=S.ric.find(x=>x.id==id);if(!r)return '<p class="s">Ricetta non trovata.</p>';return `<div class="row"><button onclick="prFc('${id}')">Stampa scheda</button></div>`+fcHtml(r,fcCalc(r))}
function prFc(id){const r=S.ric.find(x=>x.id==id);if(!r)return;pr(`${azH()}<h2>Food cost · ${e(r.nome)} (${e(r.sigla)})</h2>`+fcHtml(r,fcCalc(r)).replace(/<div class="row">.*?<\/div>/s,''),'Food cost '+r.sigla,'@page{size:A4;margin:10mm}body{margin:0}th{background:#eee}')}
let CM='',CD='';
function cal(){return S.cal||(S.cal=[])}
function calMonth(){return CM||td().slice(0,7)}
function calDay(){return CD||td()}
function calTitle(){return mese(calMonth())}
function calGrid(){const M=calMonth(),[y,m]=M.split('-').map(Number),first=(new Date(y,m-1,1).getDay()+6)%7,n=new Date(y,m,0).getDate(),ev=calAll(),sel=calDay(),t=td();let h='<style>.cgr{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cgr .ch{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--s);padding-bottom:4px}.cgr button{min-height:0;height:44px;margin:0;padding:0;font-size:15px;font-weight:600;background:var(--iv);color:var(--t);border:1px solid var(--bd);border-radius:12px;position:relative}.cgr .today{background:var(--g);color:#fff;border-color:var(--g)}.cgr .on{outline:3px solid var(--o);outline-offset:1px}.cgr i{position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#b3402a}</style><div class="cgr">'+['Lu','Ma','Me','Gi','Ve','Sa','Do'].map(x=>`<div class="ch">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=n;d++){const ds=M+'-'+String(d).padStart(2,'0');const c=ev.filter(x=>x.data==ds&&!x.fatto).length;h+=`<button class="${ds==sel?'on ':''}${ds==t?'today':''}" onclick="CD='${ds}';calL()">${d}${c?'<i></i>':''}</button>`}return h+'</div>'}
function calAuto(){const A=[];S.mag.forEach(m=>{if(m.scad&&m.q>0)A.push({auto:1,titolo:'Scade '+m.nome+' (lotto '+m.lotto+')',tipo:'Scadenza',data:m.scad,note:'Dal magazzino'})});S.lot.forEach(l=>{if(l.scad)A.push({auto:1,titolo:'Scade lotto '+l.code+' · '+l.nome,tipo:'Scadenza',data:l.scad,note:'Dal lotto di produzione'})});return A}
function calMini(){const M=td().slice(0,7),[y,m]=M.split('-').map(Number),first=(new Date(y,m-1,1).getDay()+6)%7,n=new Date(y,m,0).getDate(),ev=calAll(),t=td();let h=`<div style="font:700 10px Inter,system-ui,sans-serif;text-align:center;text-transform:capitalize;color:var(--t);margin-bottom:4px">${mese(M)}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font:600 8px Inter,system-ui,sans-serif;text-align:center;color:var(--s);margin-bottom:2px">${['L','M','M','G','V','S','D'].map(x=>`<div>${x}</div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font:600 9px Inter,system-ui,sans-serif;text-align:center;color:var(--t)">`;for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=n;d++){const ds=M+'-'+String(d).padStart(2,'0');const has=ev.some(x=>x.data==ds&&!x.fatto);const today=ds==t;h+=`<div style="height:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;${today?'border:1.5px solid var(--g);border-radius:50%;font-weight:700':''}"><div style="font-size:9px;line-height:1;margin:0">${d}</div>${has?'<div style="width:3px;height:3px;border-radius:50%;background:#b3402a"></div>':''}</div>`}return h+'</div>'}
function calToday(){const t=td(),L=calAll().filter(x=>x.data==t&&!x.fatto).sort((a,b)=>(a.ora||'').localeCompare(b.ora||''));return `<div style="margin-top:10px;font:600 13px Inter,system-ui,sans-serif;color:var(--t);text-align:left"><div style="font-size:11px;color:var(--s);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Oggi</div>`+(L.length?L.slice(0,3).map(x=>`<div style="margin:3px 0">${x.ora?e(x.ora)+' · ':''}${e(x.titolo)}</div>`).join('')+(L.length>3?`<div style="color:var(--s)">+${L.length-3} altri</div>`:''):'<div style="color:var(--s)">Nessun evento oggi</div>')+'</div>'}
function calAll(){return cal().concat(calAuto())}
function calItem(x,showDate){const col=x.tipo=='Scadenza'?'#b3402a':x.tipo=='Ordine da produrre'?'#D7B77A':'#172D28';return `<div class="c" ${x.auto?'':`onclick="go('calF','${x.id}')"`} style="border-left:5px solid ${col};${x.auto?'background:var(--iv);':''}${x.fatto?'opacity:.55':''}"><b>${x.ora?e(x.ora)+' · ':''}${e(x.titolo)}</b> <span class="tag">${e(x.tipo)}</span>${x.fatto?' <span class="s">✔ fatto</span>':''}${showDate?`<div class="s">${df(x.data)}</div>`:''}${x.note?`<div class="s">${e(x.note)}</div>`:''}</div>`}
function calUp(){const t=td();const L=cal().filter(x=>!x.fatto&&x.data>=t).sort((a,b)=>a.data.localeCompare(b.data)||(a.ora||'').localeCompare(b.ora||'')).slice(0,4);return L.length?L.map(x=>calItem(x,true)).join(''):'<p class="s">Nessun evento in programma.</p>'}
function calDayList(){const D=calDay(),L=calAll().filter(x=>x.data==D).sort((a,b)=>(a.ora||'').localeCompare(b.ora||''));return `<div class="s"><b>${df(D)}</b></div>`+(L.map(x=>calItem(x,false)).join('')||'<p class="s">Nessun evento per questo giorno.</p>')}
function calNav(n){const [y,m]=calMonth().split('-').map(Number);const d=new Date(y,m-1+n,1);CM=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');CD=CM+'-01';calL()}
function calL(){$('#cmt').textContent=calTitle();$('#cg').innerHTML=calGrid();$('#cdl').innerHTML=calDayList()}
function saveCal(id){const titolo=val('ct').trim(),data=val('cdt');if(!titolo||!data)return alert('Inserisci titolo e data.');const d={titolo,tipo:val('ctp'),data,ora:val('cora'),note:val('cn').trim(),fatto:document.getElementById('cf').checked};if(id){const x=cal().find(y=>y.id==id);if(x)Object.assign(x,d)}else cal().push({id:uid(),...d});CM=data.slice(0,7);CD=data;save();go('cal')}
async function delCal(id){const x=cal().find(y=>y.id==id);if(x&&await ask('Eliminare l\'evento "'+x.titolo+'"?')){S.cal=cal().filter(y=>y.id!=id);save();go('cal')}}

function tem(){return S.tem||(S.tem=[])}
function strs(){if(!S.strumenti)S.strumenti=[{nome:'Frigo 1',min:0,max:4},{nome:'Frigo 2',min:0,max:4},{nome:'Abbattitore',min:-18,max:3}];return S.strumenti}
function fuori(x){const s=strs().find(y=>y.nome==x.strumento);return !!s&&(+x.temp<+s.min||+x.temp>+s.max)}
function temM(){return TM||td().slice(0,7)}
function temList(){return tem().filter(x=>(x.data||'').slice(0,7)==temM()).sort((a,b)=>b.data.localeCompare(a.data)||(b.ora||'').localeCompare(a.ora||''))}

function temBody(){const L=temList();if(!L.length)return '<p class="s">Nessuna lettura in questo mese.</p>';const days=[...new Set(L.map(x=>x.data))];return days.map(d=>{const R=L.filter(x=>x.data==d).sort((a,b)=>(a.ora||'').localeCompare(b.ora||'')),f=R.filter(fuori).length;return `<div style="margin:16px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font:700 17px Playfair Display,Georgia,serif">${df(d)}</b><span class="s">${R.length} letture${f?' · <b style="color:#FF7A6B">'+f+' fuori range</b>':''}</span></div>`+R.map(temItem).join('')}).join('')}
function temL(){$('#tl').innerHTML=temBody()}
function saveTem(id){const data=val('td_'),ora=val('to_'),op=val('top_').trim();if(!data)return alert('Inserisci la data.');
if(id){const strumento=val('ts_'),tv=val('tv_');if(tv==='')return alert('Inserisci la temperatura.');const x=tem().find(y=>y.id==id);if(x)Object.assign(x,{data,ora,strumento,temp:+tv,op})}
else{const L=strs().map((s,i)=>({s,v:val('tv'+i)})).filter(o=>o.v!=='');if(!L.length)return alert('Inserisci almeno una temperatura.');L.forEach(o=>tem().push({id:uid(),data,ora,strumento:o.s.nome,temp:+o.v,op}))}
TM=data.slice(0,7);save();go('tem')}
async function delTem(id){const x=tem().find(y=>y.id==id);if(x&&await ask('Eliminare la lettura del '+df(x.data)+' ('+x.strumento+')?')){S.tem=tem().filter(y=>y.id!=id);save();go('tem')}}
function upStr(i,k,v){const s=strs()[i];if(!s)return;s[k]=k=='nome'?v.trim():+v;save()}
function addStr(){strs().push({nome:'Nuovo strumento',min:0,max:4});save();go('temS')}
async function delStr(i){const s=strs()[i];if(s&&await ask('Eliminare lo strumento "'+s.nome+'"? Le letture già registrate restano.')){strs().splice(i,1);save();go('temS')}}
function prTem(){const L=temList();if(!L.length)return alert('Nessuna lettura in questo mese.');const names=[...new Set(L.map(x=>x.strumento))];const tabs=names.map(n=>{const R=L.filter(x=>x.strumento==n).sort((a,b)=>a.data.localeCompare(b.data)||(a.ora||'').localeCompare(b.ora||'')),st=strs().find(y=>y.nome==n),f=R.filter(fuori).length;return `<h3 style="margin:16px 0 4px;font-size:16px">${e(n)}${st?' <span style="font-weight:400;font-size:12px">(range ${nf(st.min)} / ${nf(st.max)} °C)</span>':''}${f?' <span style="font-size:12px;color:#b3402a"><b>'+f+' fuori range</b></span>':''}</h3><table border=1 cellspacing=0 cellpadding=5 style="width:100%;font-size:12px"><tr><th>Data</th><th>Ora</th><th>Temp. °C</th><th>Operatore</th></tr>${R.map(x=>`<tr><td>${df(x.data)}</td><td>${e(x.ora)}</td><td>${nf(x.temp)}</td><td>${e(x.op)}</td></tr>`).join('')}</table>`}).join('');pr(`${azH()}<h2>Registro temperature · ${mese(temM())}</h2>${tabs}<p style="margin-top:14px">Controllato da: ______________________ &nbsp; Firma: ______________________</p>`,'Registro temperature '+temM(),'@page{size:A4 landscape;margin:10mm}body{margin:0}th{background:#eee}')}
function saveMag(id){const nome=val('mn').trim(),q=val('mq');if(!nome||q===''||+q<0||(!id&&+q<=0))return alert('Inserisci materia prima e quantità.');const d={nome,forn:val('mf'),q:+q,u:val('mu'),lotto:val('ml').trim(),carico:val('mc'),scad:val('ms'),prezzo:+val('mp')||0};if(id){const m=S.mag.find(x=>x.id==id);if(m)Object.assign(m,d)}else S.mag.push({id:uid(),...d});save();go('mag')}

render();
